name: Teste Selenium - Google

on:
  workflow_dispatch:

concurrency:
  group: rpa-windows-producao
  cancel-in-progress: false

jobs:
  executar:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Baixar código do Git
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verificar Python
        run: python --version

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar Selenium
        run: python -u teste_selenium.py

      - name: Guardar captura de tela
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultado-selenium
          path: |
            resultado_capivara.png
            erro_selenium.png
          if-no-files-found: ignore
