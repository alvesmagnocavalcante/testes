name: Teste DrissionPage - Google

on:
  workflow_dispatch:

concurrency:
  group: rpa-windows-producao
  cancel-in-progress: false

jobs:
  executar:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Baixar código do Git
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar DrissionPage
        run: python -m pip install -r requirements.txt

      - name: Executar teste
        run: python -u teste_selenium.py
